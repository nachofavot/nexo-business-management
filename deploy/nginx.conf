# Reemplaza /etc/nginx/conf.d/default.conf de nginxinc/nginx-unprivileged, que corre sin root.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No publicar la versión de nginx en la cabecera Server ni en las páginas de error.
    server_tokens off;

    # Cloud Run recibe HTTPS y le habla al contenedor por HTTP en el puerto 8080. Con redirecciones
    # absolutas, nginx mandaría al navegador a http://…:8080.
    absolute_redirect off;

    # Cloud Run no comprime las respuestas: lo hace nginx. El JS pasa de unos 327 a 108 kB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # Cualquier ruta de la SPA, como /clientes, sirve index.html y el router decide qué mostrar.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    # Se vuelve a pedir en cada visita: así un despliegue nuevo apunta a los archivos nuevos.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Los nombres llevan un hash: si el contenido cambia, cambia el nombre. Se guardan un año.
    # Sin "always", un 404 no se guarda: el archivo puede llegar en el próximo despliegue.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
