# Cabeceras de seguridad de todas las respuestas. Los valores salen de deploy/security-headers.ts y un
# test los compara. Se incluye en cada location: un add_header dentro de un location anula los que
# vienen del bloque server. "always" hace que también vayan en los errores, como un 404.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
